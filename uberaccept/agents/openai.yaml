interface:
  display_name: "Uberaccept"
  short_description: "Adversarial acceptance and proof"
  default_prompt: "Use $uberaccept only when explicitly invoked or routed by $ubergoal; do not auto-trigger from task similarity. Assess the exact approved scope, candidate diff, and evidence; map each material acceptance criterion; try to disprove readiness; return one typed acceptance_status. Preserve authoritative rejection but never convert missing or unknown state into rejected. Use fix_within_scope, replan, user_decision, or blocked_with_failure_intake precisely. Scale proof with activated risk, require black-box or runtime proof when the claim needs it, and do not generate a universal report, broad tests, reviewers, or artifacts merely for ceremony. Only accepted authorizes completion."
policy:
  allow_implicit_invocation: true
