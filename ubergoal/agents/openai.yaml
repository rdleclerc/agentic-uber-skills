interface:
  display_name: "Ubergoal"
  short_description: "Goal-owning wrapper for Uber coding workflows"
  default_prompt: "Use $ubergoal to create or bind a platform goal when available, bind execution to the exact approved $uberplan or micro-intent revision, reread the named owner/caller/proof before editing, and keep planned work distinct from replan and user-authority decisions. Scale review by the tier ladder; Tier 2 uses one independent risk-specific lane, not a board. Do not add docs, broad tests, reviewers, subagents, or lifecycle artifacts unless the plan, repository contract, or observed risk activates them. Planning never authorizes external action. Ubergoal never self-accepts: after plan, proof, and review, return ready_for_acceptance and route the exact diff to $uberaccept; complete only after accepted. Route assessment to $uberassess, complexity work to $ubersimplify, and post-run learning to $uberskillevolver. Stop before five consecutive failures and route model-invalidating failures to $uberrca and revised planning. Load the refactor-campaign profile when requested, and preserve the $uberplan user expectation/surprise gate."
policy:
  allow_implicit_invocation: true
