interface:
  display_name: "Uberplan"
  short_description: "Smallest complete plan from decisive sources"
  default_prompt: "Use $uberplan only when explicitly invoked or routed by $ubergoal; do not auto-trigger from task similarity. Read the governing source, current owner, direct boundary, and focused proof, then stop when the decision is supported. Return the smallest complete linear plan with proportional acceptance evidence. Allow a micro-intent fast path with scope, acceptance criteria, out-of-scope, and verification. Inline contained plans are valid; create a durable plan only for requested, long-running, resumable, multi-owner, or handoff work. Load templates, loops, reviews, and agentic safeguards only when evidence activates them. For a proven cross-boundary architecture failure, route to $uberarchitect for architecture stepback, viable avenues, blockers, implications, pitfalls without turning uberplan into uberengineering. For agentic or external-write scope, load the architecture checklist for permissions, approvals, idempotency, replay, and evals. Require benefit >> cost."
policy:
  allow_implicit_invocation: true
