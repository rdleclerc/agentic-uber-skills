# Doctrine drift fingerprints for the pack-contract aggregator.
# Rewording a fingerprinted rule means updating this registry in the same change.

[[fingerprint]]
id = "test-channel-posture"
owner = "pack maintainer"
adoption_state = "report_only"
canonical_source = "${GAIA_ROOT:-~/repos/agfunder-gaia}/CLAUDE.md#live-slack-proof-gate"
target_paths = [
  "${GAIA_ROOT:-~/repos/agfunder-gaia}/GAIA_TESTING.md",
  "${GAIA_ROOT:-~/repos/agfunder-gaia}/CLAUDE.md",
  "${GAIA_ROOT:-~/repos/agfunder-gaia}/AGENTS.md",
  "${GAIA_ROOT:-~/repos/agfunder-gaia}/skills/gaia-testing/SKILL.md",
]
match = "literal"
pattern = '''Rob has pre-approved live Slack proof prompts in `#gaia-testing-alpha` as part of Gaia testing. Do not pause to ask for permission before posting a realistic proof prompt there. There should normally be a Chrome window with Slack web open; use that Slack web window for the live proof path before falling back to another Slack access path. This pre-approval is only for the alpha testing channel and Gaia proof prompts, not for external/customer channels or unrelated Slack posting.'''
normalization = "whitespace"
allowed_absences = []
severity = "warn"
blocking_wave = 2
pending = "Wave 2c propagation"

